services:
  # Trunk Recorder: receives from the SDR (USB passthrough required on Pi)
  trunk-recorder:
    image: robotastic/trunk-recorder:latest
    container_name: trunk-recorder
    restart: unless-stopped
    volumes:
      - ./data/recordings:/recordings
      - ./config:/config
    command: ["--config=/config/config.json"]
    # Uncomment for host USB access (Pi, dedicated SDR box):
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # privileged: true

  # Web UI + scanner roles (watcher, transcriber, bot, tone-detector)
  webui:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    image: trunk-recorder-webui:latest
    container_name: trunk-recorder-webui
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./data/recordings:/recordings:ro
      - ./data:/app/data
      - ./config:/app/config
    env_file:
      - .env
    environment:
      - PORT=8080
      - NODE_ENV=production
